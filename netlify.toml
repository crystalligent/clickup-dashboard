[build]
  publish = "."
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "18"

# Scheduled: fetch GitLab issues into queue every 30 minutes
[functions."sync-gitlab"]
  schedule = "*/30 * * * *"
  node_bundler = "esbuild"
  external_node_modules = ["@netlify/blobs"]

# Scheduled: process queue batch every 5 minutes
[functions."process-queue"]
  schedule = "*/5 * * * *"
  node_bundler = "esbuild"
  external_node_modules = ["@netlify/blobs"]

[functions."sync-trigger"]
  node_bundler = "esbuild"
  external_node_modules = ["@netlify/blobs"]

[functions."sync-single"]
  node_bundler = "esbuild"
  external_node_modules = ["@netlify/blobs"]

[functions."logs-store"]
  node_bundler = "esbuild"
  external_node_modules = ["@netlify/blobs"]

[functions."gitlab-webhook"]
  node_bundler = "esbuild"
  external_node_modules = ["@netlify/blobs"]

[functions."dedup-tasks"]
  node_bundler = "esbuild"
  external_node_modules = ["@netlify/blobs"]

[dev]
  functions-timeout = 120

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Clean URL for the GitLab webhook endpoint
[[redirects]]
  from = "/webhook/gitlab"
  to = "/.netlify/functions/gitlab-webhook"
  status = 200

# Clean URL for manual sync trigger
[[redirects]]
  from = "/api/sync"
  to = "/.netlify/functions/sync-trigger"
  status = 200

# Clean URL for logs API
[[redirects]]
  from = "/api/logs"
  to = "/.netlify/functions/logs-store"
  status = 200

# Clean URL for dedup
[[redirects]]
  from = "/api/dedup"
  to = "/.netlify/functions/dedup-tasks"
  status = 200

# Clean URL for single issue sync
[[redirects]]
  from = "/api/sync-single"
  to = "/.netlify/functions/sync-single"
  status = 200
