[build]
  publish = "."
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "18"

# Scheduled function: sync GitLab issues every 5 minutes
# Note: in local dev, hit GET /api/sync manually. In production Netlify runs this on schedule.
[functions."sync-gitlab"]
  schedule = "*/30 * * * *"
  node_bundler = "esbuild"
  external_node_modules = ["@netlify/blobs"]

[functions."sync-trigger"]
  node_bundler = "esbuild"
  external_node_modules = ["@netlify/blobs"]

[functions."logs-store"]
  node_bundler = "esbuild"
  external_node_modules = ["@netlify/blobs"]

[functions."gitlab-webhook"]
  node_bundler = "esbuild"
  external_node_modules = ["@netlify/blobs"]

[dev]
  # Increase local dev function timeout to 120 seconds
  functions-timeout = 120

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Clean URL for the GitLab webhook endpoint
[[redirects]]
  from = "/webhook/gitlab"
  to = "/.netlify/functions/gitlab-webhook"
  status = 200

# Clean URL for manual sync trigger
[[redirects]]
  from = "/api/sync"
  to = "/.netlify/functions/sync-trigger"
  status = 200

# Clean URL for logs API
[[redirects]]
  from = "/api/logs"
  to = "/.netlify/functions/logs-store"
  status = 200

# Clean URL for dedup
[[redirects]]
  from = "/api/dedup"
  to = "/.netlify/functions/dedup-tasks"
  status = 200
